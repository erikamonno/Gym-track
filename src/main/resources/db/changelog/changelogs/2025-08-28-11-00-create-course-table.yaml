databaseChangeLog:
  - changeSet:
      id: 0
      author: Erika Monno
      changes:
        - createTable:
            tableName: course
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: valid_from
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: valid_to
                  type: timestamp with time zone
                  constraints:
                    nullable: false