databaseChangeLog:
  - changeSet:
      id: 0
      author: Erika Monno
      changes:
        - createTable:
            tableName: course_schedule
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: course_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_course_schedule_course_id
                    referencedTableName: course
                    referencedColumnNames: id
              - column:
                  name: day
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false